[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "al-brooks-dubbed"
version = "0.3.1"
description = "Phase 1: video segmentation and English transcription pipeline for the Al Brooks dubbing project."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "groq>=0.13.0,<2.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
al-brooks-dubbed = "src.cli:main"

[tool.setuptools]
packages = ["src"]

[tool.setuptools.package-data]
# The Al Brooks glossary must ship with the package, otherwise terminology
# lookup fails on a non-editable install.
src = ["resources/*.json"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM", "RET", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Test doubles are lambdas that intentionally ignore some arguments.
"tests/*" = ["ARG001", "ARG002", "ARG005"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["groq.*", "dotenv.*"]
ignore_missing_imports = true